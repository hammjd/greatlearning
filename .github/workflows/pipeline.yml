name: Tourism Project Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  register-dataset:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r project/deployment/requirements.txt

      - name: Register Dataset
        run: python project/models/data_register.py

      - name: Upload Registered Dataset
        uses: actions/upload-artifact@v4
        with:
          name: registered-data
          path: project/data/tourism.csv
          if-no-files-found: error

  data-prep:
    needs: register-dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r project/deployment/requirements.txt

      - name: Download Registered Dataset
        uses: actions/download-artifact@v4
        with:
          name: registered-data
          path: project/data

      - name: Run Data Preparation
        run: python project/models/prep.py

      - name: Upload Train Test Splits
        uses: actions/upload-artifact@v4
        with:
          name: data-splits
          path: |
            Xtrain.csv
            Xtest.csv
            ytrain.csv
            ytest.csv
          if-no-files-found: error

  model-training:
    needs: data-prep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: pip install -r project/deployment/requirements.txt mlflow

      - name: Download Train Test Splits
        uses: actions/download-artifact@v4
        with:
          name: data-splits

      - name: Start MLflow Server
        run: |
          nohup mlflow server --host 127.0.0.1 --port 5000 > mlflow.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          cat mlflow.log
          exit 1

      - name: Model Building
        run: python project/models/train.py

      - name: Commit Trained Model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add project/deployment/*.joblib
          if git diff --cached --quiet; then
            echo "No model changes to commit"
          else
            git commit -m "Add trained model [skip ci]"
            git push
          fi
